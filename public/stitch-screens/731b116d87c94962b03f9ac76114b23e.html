<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clinical Encounter - Atunse Health</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "inverse-primary": "#a8c8ff",
                        "on-error-container": "#93000a",
                        "outline-variant": "#c3c6d0",
                        "status-warning": "#B76E00",
                        "status-info": "#005EB8",
                        "on-tertiary-container": "#6e98db",
                        "primary-fixed": "#d5e3ff",
                        "inverse-on-surface": "#f3f0ef",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1c1b1b",
                        "on-error": "#ffffff",
                        "surface-container": "#f0edec",
                        "surface-container-high": "#ebe7e7",
                        "border-subtle": "#E4E7EC",
                        "secondary-fixed": "#ffe088",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "tertiary": "#001a3b",
                        "on-tertiary-fixed": "#001b3c",
                        "on-secondary-fixed-variant": "#574500",
                        "surface-dim": "#dcd9d9",
                        "primary-container": "#002f5f",
                        "secondary-fixed-dim": "#e9c349",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#e5e2e1",
                        "secondary": "#735c00",
                        "surface-bright": "#fcf9f8",
                        "on-secondary-fixed": "#241a00",
                        "tertiary-container": "#002f60",
                        "outline": "#737780",
                        "status-danger": "#C8372D",
                        "surface-variant": "#e5e2e1",
                        "text-secondary": "#667085",
                        "primary": "#001a3a",
                        "on-background": "#1c1b1b",
                        "tertiary-fixed-dim": "#a8c8ff",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#a8c8ff",
                        "secondary-container": "#fed65b",
                        "surface": "#F8F8F6",
                        "on-primary-fixed-variant": "#234778",
                        "on-tertiary-fixed-variant": "#104685",
                        "on-primary-container": "#7798ce",
                        "on-surface-variant": "#43474f",
                        "status-success": "#2D8A39",
                        "on-secondary-container": "#745c00",
                        "on-primary-fixed": "#001b3c",
                        "inverse-surface": "#313030",
                        "background": "#fcf9f8",
                        "surface-tint": "#3d5f92",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed": "#d6e3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "sidebar-width": "256px",
                        "gutter": "16px",
                        "control-min-height": "40px",
                        "margin-mobile": "16px",
                        "margin-desktop": "24px",
                        "stack-compact": "8px",
                        "stack-relaxed": "16px"
                    },
                    "fontFamily": {
                        "table-data": ["Inter"],
                        "card-title": ["Inter"],
                        "supporting": ["Inter"],
                        "section-title": ["Inter"],
                        "body-medium": ["Inter"],
                        "headline-lg": ["Inter"],
                        "micro-label": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-default": ["Inter"]
                    },
                    "fontSize": {
                        "table-data": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "card-title": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "supporting": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "section-title": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "body-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "micro-label": ["11px", { "lineHeight": "14px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-default": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body-default min-h-screen flex">
<!-- Main Content Canvas -->
<div class="flex-1 flex flex-col h-screen overflow-hidden">
<!-- TopAppBar (Suppressed for focused encounter, but keeping a minimal contextual header) -->
<header class="bg-white border-b border-border-subtle h-[64px] flex items-center justify-between px-6 shrink-0">
<div class="flex items-center gap-4">
<button class="text-text-secondary hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded hover:bg-surface-container-low">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div>
<h1 class="font-section-title text-section-title text-primary m-0">Clinical Encounter</h1>
<div class="flex items-center gap-2 mt-1">
<span class="font-supporting text-supporting text-text-secondary">Adesenya</span>
<span class="w-1 h-1 bg-border-subtle rounded-full"></span>
<span class="font-supporting text-supporting text-text-secondary">ATN-000184</span>
<span class="w-1 h-1 bg-border-subtle rounded-full"></span>
<span class="font-micro-label text-micro-label bg-status-success/10 text-status-success px-1.5 py-0.5 rounded">IN PROGRESS</span>
</div>
</div>
</div>
<div class="flex items-center gap-3">
<button class="text-text-secondary hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded hover:bg-surface-container-low">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Encounter Workspace -->
<main class="flex-1 flex overflow-hidden">
<!-- Documentation Area (Left/Main) -->
<div class="flex-1 flex flex-col bg-surface overflow-y-auto">
<div class="p-6 max-w-4xl mx-auto w-full space-y-6">
<!-- Reason for Visit -->
<section class="bg-white border border-border-subtle rounded p-4">
<h2 class="font-card-title text-card-title text-primary mb-4 flex items-center gap-2 border-b border-border-subtle pb-2">
<span class="material-symbols-outlined text-[20px] text-text-secondary">assignment</span>
                            Reason for Visit
                        </h2>
<div class="space-y-3">
<div class="relative">
<label class="absolute -top-2 left-2 bg-white px-1 font-supporting text-supporting text-text-secondary">Chief Complaint</label>
<textarea class="w-full border border-border-subtle rounded p-3 font-body-default text-body-default min-h-[80px] focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container resize-y" placeholder="Patient reports..."></textarea>
</div>
</div>
</section>
<!-- History -->
<section class="bg-white border border-border-subtle rounded p-4">
<h2 class="font-card-title text-card-title text-primary mb-4 flex items-center gap-2 border-b border-border-subtle pb-2">
<span class="material-symbols-outlined text-[20px] text-text-secondary">history</span>
                            History of Present Illness
                        </h2>
<div class="space-y-3">
<textarea class="w-full border border-border-subtle rounded p-3 font-body-default text-body-default min-h-[120px] focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container resize-y" placeholder="Document HPI..."></textarea>
</div>
</section>
</div>
</div>
<!-- Patient Context (Right Rail) -->
<aside class="w-[320px] bg-white border-l border-border-subtle flex flex-col shrink-0 overflow-y-auto">
<div class="p-4 space-y-6">
<!-- Alerts -->
<div>
<h3 class="font-micro-label text-micro-label text-text-secondary uppercase tracking-wider mb-2">Critical Alerts</h3>
<div class="bg-error-container/20 border-l-2 border-status-danger p-2 rounded-r flex items-start gap-2">
<span class="material-symbols-outlined text-status-danger text-[16px] mt-0.5">warning</span>
<span class="font-supporting text-supporting text-on-surface">Penicillin Allergy - Anaphylaxis</span>
</div>
</div>
</div>
</aside>
</main>
<!-- Encounter Footer -->
<footer class="bg-white border-t border-border-subtle h-[64px] flex items-center justify-between px-6 shrink-0 shadow-[0_-2px_4px_rgba(0,0,0,0.02)] relative z-10">
<div class="flex items-center gap-4 text-text-secondary font-supporting text-supporting">
<span>Last saved: 10:42 AM</span>
</div>
<div class="flex items-center gap-3">
<button class="bg-white border border-border-subtle text-primary font-body-medium text-body-medium h-[40px] px-4 rounded hover:bg-surface-container-low transition-colors">
                    Save Draft
                </button>
<button class="bg-secondary-fixed text-on-secondary-fixed font-body-medium text-body-medium h-[40px] px-4 rounded hover:bg-secondary-fixed-dim transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">edit_document</span>
                    Sign &amp; Complete
                </button>
</div>
</footer>
</div>
</body></html>

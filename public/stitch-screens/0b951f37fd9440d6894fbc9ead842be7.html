<body class="bg-surface text-on-surface h-screen flex flex-col md:hidden">
<!-- Top Navigation (Task-focused, so no main nav shell) -->
<header class="bg-surface border-b border-border-subtle flex items-center justify-between px-margin-mobile py-3 h-[64px] shrink-0 sticky top-0 z-50">
<button class="text-primary hover:text-primary-container p-2 -ml-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 flex flex-col items-center justify-center">
<h1 class="font-section-title text-section-title text-primary truncate max-w-[200px]">James Wilson</h1>
<span class="font-micro-label text-micro-label text-text-secondary uppercase">ADDSB • Session 3 of 6</span>
</div>
<div class="flex items-center gap-2">
<div class="flex items-center gap-1 bg-surface-variant px-2 py-1 rounded-full border border-border-subtle" title="Offline Mode">
<span class="material-symbols-outlined text-[14px] text-text-secondary" style="font-variation-settings: 'FILL' 0;">cloud_off</span>
<span class="font-micro-label text-micro-label text-text-secondary hidden sm:inline">Offline</span>
</div>
<button class="text-primary hover:text-primary-container p-2 -mr-2 rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">more_vert</span>
</button>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto bg-surface-bright px-margin-mobile py-6 flex flex-col gap-stack-relaxed">
<!-- Workflow Progress -->
<div class="flex flex-col gap-2 mb-2">
<div class="flex justify-between items-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Pre-treatment Readiness</h2>
<span class="font-micro-label text-micro-label text-status-info bg-status-info/10 px-2 py-1 rounded-sm border border-status-info/20">Step 1 of 4</span>
</div>
<p class="font-body-default text-body-default text-text-secondary">Verify all prerequisites before initiating the infusion protocol.</p>
</div>
<!-- Progress Bar -->
<div class="w-full bg-border-subtle h-2 rounded-full overflow-hidden flex">
<div class="bg-primary h-full w-1/4"></div>
</div>
<!-- Checklist Section -->
<div class="flex flex-col gap-stack-compact mt-4">
<!-- Checklist Item 1: Completed -->
<button class="w-full bg-surface-container-lowest border border-border-subtle rounded-xl p-4 flex items-start gap-4 text-left active:bg-surface-variant transition-colors group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-status-success"></div>
<div class="w-6 h-6 rounded-full bg-status-success flex items-center justify-center shrink-0 mt-0.5">
<span class="material-symbols-outlined text-white text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-card-title text-card-title text-primary">Prior Authorisations</h3>
<p class="font-supporting text-supporting text-text-secondary">Verify payer approval for current cycle.</p>
<div class="flex items-center gap-2 mt-2">
<div class="w-5 h-5 rounded-full bg-surface-variant border border-border-subtle overflow-hidden shrink-0">
<img class="w-full h-full object-cover" data-alt="A small, professional headshot photo of a female clinical coordinator wearing scrubs in a well-lit modern medical office setting, acting as a user avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAG8pEgrsHXd2PN2pie8f5WxAD5wM289ChuL7IPy2lPc5L1nGWl5TCRuXV_8EB6Yd_ENMhQx3jUxyd6Mu8VJhgJiDgCwpP4eTHWkbPy9PXf7Qus5wd2WITLU_Bdt-sFOoJguEMmhgC4ck7eT8Cq7U_tuS0mo8kiE3vySvSjKZreAKzXQ-qipf_wZvedRDyQvYk2qYzFwKyFt5KLiKQ99fiVovaFZenxBOCQzmrJkOexDGeJSl1HMKSu"/>
</div>
<span class="font-micro-label text-micro-label text-text-secondary">Verified by S. Chen • 09:12 AM</span>
</div>
</div>
</button>
<!-- Checklist Item 2: Active/Pending -->
<button class="w-full bg-surface-container-lowest border-2 border-primary rounded-xl p-4 flex items-start gap-4 text-left active:bg-surface-variant transition-colors group relative overflow-hidden shadow-[0_2px_8px_rgba(0,47,95,0.08)]">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center shrink-0 mt-0.5">
</div>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-card-title text-card-title text-primary">Product Integrity</h3>
<p class="font-supporting text-supporting text-text-secondary">Scan vial barcode and check physical condition.</p>
<div class="mt-3 flex gap-2">
<div class="bg-surface-variant border border-border-subtle rounded-md px-3 py-2 flex items-center gap-2 flex-1 justify-center">
<span class="material-symbols-outlined text-[18px] text-primary" style="font-variation-settings: 'FILL' 0;">barcode_scanner</span>
<span class="font-body-medium text-body-medium text-primary">Scan Vial</span>
</div>
</div>
</div>
</button>
<!-- Checklist Item 3: Pending/Inactive -->
<button class="w-full bg-surface-container-lowest border border-border-subtle rounded-xl p-4 flex items-start gap-4 text-left opacity-75 grayscale-[20%] transition-colors">
<div class="w-6 h-6 rounded-full border-2 border-border-subtle flex items-center justify-center shrink-0 mt-0.5">
</div>
<div class="flex-1 flex flex-col gap-1">
<h3 class="font-card-title text-card-title text-text-secondary">Cold Chain Verification</h3>
<p class="font-supporting text-supporting text-text-secondary">Confirm temperature logs for transport.</p>
</div>
</button>
</div>
<!-- Bottom spacing for fixed actions -->
<div class="h-24"></div>
</main>
<!-- Bottom Actions (Fixed) -->
<div class="bg-surface border-t border-border-subtle p-margin-mobile flex gap-4 shrink-0 fixed bottom-0 left-0 right-0 z-40 pb-[env(safe-area-inset-bottom,16px)] shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<button class="flex-1 bg-surface border border-border-subtle text-primary font-body-medium text-body-medium h-control-min-height rounded-lg flex items-center justify-center active:bg-surface-variant transition-colors px-4">
            Record Exception
        </button>
<button class="flex-1 bg-primary text-on-primary font-body-medium text-body-medium h-control-min-height rounded-lg flex items-center justify-center active:bg-primary-container transition-colors px-4 gap-2 opacity-50 cursor-not-allowed" disabled="">
            Complete Step
            <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>

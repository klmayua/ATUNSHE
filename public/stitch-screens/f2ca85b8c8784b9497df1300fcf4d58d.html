<body class="bg-surface h-full flex flex-col font-body-default text-body-default text-on-surface antialiased overflow-hidden">
<!-- Top App Bar (Task-Focused - Minimal) -->
<header class="flex justify-between items-center px-4 py-3 h-[64px] bg-white border-b border-border-subtle shrink-0">
<div class="flex items-center gap-3">
<button aria-label="Back" class="p-2 text-primary hover:bg-surface-variant rounded transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<span class="font-section-title text-section-title text-primary">Protocol Execution</span>
<span class="font-supporting text-supporting text-text-secondary">Session 3 of 6</span>
</div>
</div>
<button aria-label="Help" class="p-2 text-text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined">help</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto no-scrollbar p-margin-mobile flex flex-col gap-stack-relaxed">
<!-- Patient Info Card (High Visibility) -->
<div class="bg-white rounded border border-border-subtle p-4 flex items-center gap-4">
<img class="w-12 h-12 rounded-full object-cover" data-alt="A professional headshot of an adult female patient in a clinical setting, soft natural lighting, neutral expression, high resolution, clinical photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6H_0HD6WPaNlKFpEiGtnSNhEVex3KP9-XMEJjhQYp0FOqwIumH4dJwwku1uHSo9OJRy-knymIvSrNGoUu0jbqswdYAG0Wo3ZUg0c3uvCr9V5FkdQfTpZ8twN6dH3AsdU1Gr3oRec1CVomF8NJHR1XFFBW7gNWbNrL79KnwW3OcWC_vG9mMSkbsbaD2-P_5-LTlwIWXJyGVcqAmm8PcPzKkkbs_M-pXpkfvyTN995bT4sUSDVnLVVO"/>
<div class="flex-1">
<h2 class="font-card-title text-card-title text-primary">Adesenya</h2>
<div class="flex items-center gap-2 mt-1">
<span class="font-micro-label text-micro-label text-text-secondary">DOB: 12/04/1982</span>
<span class="w-1 h-1 rounded-full bg-border-subtle"></span>
<span class="font-micro-label text-micro-label text-text-secondary">ID: PT-49281</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-micro-label text-micro-label text-status-warning bg-status-warning/10 px-2 py-1 rounded">ALLERGIES</span>
</div>
</div>
<!-- Progress Indicator -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="font-body-medium text-body-medium text-primary">Administration Step</span>
<span class="font-supporting text-supporting text-text-secondary">50% Complete</span>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary w-1/2 rounded-full"></div>
</div>
</div>
<!-- Readiness Checks (The Core Action) -->
<div class="flex flex-col gap-stack-compact mt-2">
<h3 class="font-card-title text-card-title text-primary mb-2">Pre-Administration Checks</h3>
<!-- Check 1: Correct Patient -->
<label class="flex items-start gap-4 p-4 bg-white rounded border border-border-subtle cursor-pointer active:bg-surface-container-low transition-colors">
<div class="pt-1">
<input checked="" class="w-6 h-6 rounded border-border-subtle text-primary focus:ring-primary focus:ring-offset-0 bg-white checked:bg-primary" type="checkbox"/>
</div>
<div class="flex-1">
<span class="block font-body-medium text-body-medium text-primary">Correct Patient</span>
<span class="block font-supporting text-supporting text-text-secondary mt-1">Identity verified via wristband barcode or verbal confirmation.</span>
</div>
<span class="material-symbols-outlined text-status-success">check_circle</span>
</label>
<!-- Check 2: Correct Product (Pending) -->
<label class="flex items-start gap-4 p-4 bg-white rounded border-l-2 border-l-secondary-container border border-border-subtle cursor-pointer active:bg-surface-container-low transition-colors">
<div class="pt-1">
<input class="w-6 h-6 rounded border-border-subtle text-primary focus:ring-primary focus:ring-offset-0 bg-white" type="checkbox"/>
</div>
<div class="flex-1">
<span class="block font-body-medium text-body-medium text-primary">Correct Product</span>
<span class="block font-supporting text-supporting text-text-secondary mt-1">Ocrelizumab 300mg/10mL</span>
<!-- Nested Action: Scan Barcode CTA -->
<button class="mt-3 flex items-center justify-center gap-2 w-full h-10 bg-surface-container text-primary font-body-medium text-body-medium rounded hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[20px]">barcode_scanner</span>
                        Scan Product Barcode
                    </button>
</div>
</label>
<!-- Check 3: Correct Dose (Pending) -->
<label class="flex items-start gap-4 p-4 bg-white rounded border border-border-subtle cursor-pointer active:bg-surface-container-low transition-colors opacity-70 pointer-events-none">
<div class="pt-1">
<input class="w-6 h-6 rounded border-border-subtle text-primary focus:ring-primary focus:ring-offset-0 bg-white" disabled="" type="checkbox"/>
</div>
<div class="flex-1">
<span class="block font-body-medium text-body-medium text-primary">Correct Dose &amp; Route</span>
<span class="block font-supporting text-supporting text-text-secondary mt-1">300mg IV Infusion over 2.5 hours.</span>
</div>
</label>
</div>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="p-4 bg-white border-t border-border-subtle shrink-0">
<button class="w-full h-12 bg-primary text-white font-body-medium text-body-medium rounded flex items-center justify-center gap-2 opacity-50 cursor-not-allowed" disabled="">
<span class="material-symbols-outlined text-[20px]">how_to_reg</span>
            Sign &amp; Proceed
